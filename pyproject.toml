[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "23hg-multiagent-system"
version = "3.0.0"
authors = [
  { name="Nguyễn Bảo Tú (@baotuhg)", email="137134098+baotuhg@users.noreply.github.com" },
]
description = "Autonomous Closed-Loop Multi-Agent System for Civil Engineering (State Graph, AI Supervisor, OR-Tools Rebar, CPM, QA/QC Lab Link & As-Built Loop)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "ezdxf>=1.4.0",
    "numpy>=1.26.0",
    "ortools>=9.0.0",
    "pandas>=2.0.0",
    "python-dateutil>=2.9.0",
]

[project.urls]
"Homepage" = "https://github.com/baotuhg/23HG-multiagent-system"
"Bug Tracker" = "https://github.com/baotuhg/23HG-multiagent-system/issues"
