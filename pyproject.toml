[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "23hg-multiagent-system"
version = "3.1.0"
authors = [
  { name="Nguyễn Bảo Tú (@baotuhg)", email="137134098+baotuhg@users.noreply.github.com" },
]
description = "Autonomous Closed-Loop Multi-Agent System for Civil Engineering (Office 365 Dynamic Engine, State Graph, AI Supervisor, OR-Tools Rebar, CPM, QA/QC Lab Link & As-Built Loop)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "python-dotenv>=1.0.0",
    "lxml>=5.0.0",
    "python-docx>=1.2.0",
    "ezdxf>=1.4.0",
    "ifcopenshell>=0.9.0",
    "numpy>=1.26.0",
    "ortools>=9.0.0",
    "pandas>=2.0.0",
    "python-dateutil>=2.9.0",
]

[project.urls]
"Homepage" = "https://github.com/baotuhg/23HG-multiagent-system"
"Bug Tracker" = "https://github.com/baotuhg/23HG-multiagent-system/issues"

[project.scripts]
23hg-aec = "run_state_graph:main"
23hg-sync-xp = "tools.sync_project_experience:sync_all_historical_experiences"


[tool.setuptools]
py-modules = ["run_state_graph"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "aec_core*", "tools*", "schemas*", "skills*", "data", "knowledge", "templates"]
exclude = ["tests*", "examples*", "scratch*", "du_lieu_du_an*"]

[tool.setuptools.package-data]
data = ["*.json"]
knowledge = ["*.json"]
templates = ["*.csv", "*.json", "*.xlsx", "*.xml", "*.mpp", "*.docx", "*.md"]
"*" = ["SKILL.md", "*.json"]
